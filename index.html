    <script>
      // Suppress harmless Vite HMR/WebSocket errors in AI Studio iframe environment
      window.addEventListener('error', function(event) {
        if (
          event &&
          (event.message?.includes('WebSocket') ||
            event.message?.includes('createWebSocketModuleRunnerTransport') ||
            event.filename?.includes('@vite/client') ||
            (typeof event.error?.stack === 'string' && event.error.stack.includes('@vite/client')))
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function(event) {
        if (
          event &&
          event.reason &&
          (event.reason.message?.includes('WebSocket') ||
            event.reason.message?.includes('createWebSocketModuleRunnerTransport') ||
            (typeof event.reason.stack === 'string' && event.reason.stack.includes('@vite/client')))
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
    </script>
